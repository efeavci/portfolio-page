name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Check for preview branch
        id: preview
        shell: bash
        run: |
          refs=$(git ls-remote --heads origin refs/heads/feature/monitoring-projekt)
          if [[ -n "$refs" ]]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.preview.outputs.present == 'true'
        with:
          ref: feature/monitoring-projekt
          path: preview-src
          persist-credentials: false
      - name: Build branch preview
        if: steps.preview.outputs.present == 'true'
        working-directory: preview-src
        run: |
          npm ci
          npm run build -- --base=/portfolio-page/vorschau/
          mkdir -p ../dist/vorschau
          cp -a dist/. ../dist/vorschau/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
