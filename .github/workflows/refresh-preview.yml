name: Refresh monitoring preview
on:
  push:
    branches: [feature/monitoring-projekt]

permissions:
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Start a fresh combined Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
